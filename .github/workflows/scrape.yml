name: BSDI Announcement Scrape

on:
  schedule:
    - cron: "0 5 * * 1"    # 05:00 UTC every Monday = weekly run, narrow lookback
  workflow_dispatch:        # allows manual trigger from the Actions tab, with an optional wide backfill
    inputs:
      lookback_days:
        description: "How many days back to search (leave blank for default weekly window)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: python scraper.py
